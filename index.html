<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <nav>
            <div class="left">
                Kanban
            </div>
            <div class="right">
                <button class="add-task" id="toggle-modal">Add new task</button>
            </div>
        </nav>

        <section class="board">
            <div class="task-column" id="to-do">
                <div class="heading">
                    <div class="left">To do</div>
                    <div class="right">Count</div>
                </div>
            </div>

            <div class="task-column" id="in-progress">
                <div class="heading">
                    <div class="left">In progress</div>
                    <div class="right">Count</div>
                </div>
            </div>

            <div class="task-column" id="done">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal add-new-task">
        <div class="bg"></div>
        <div class="center">
            <input type="text" placeholder="Task name" id="add-task-name">
            <textarea placeholder="Task description" id="task-desc-input"></textarea>
            <button class="add-task-button" id="add-new-task">Add Task</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
